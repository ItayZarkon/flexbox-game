<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>משחק Flexbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <h1>משחק לימוד Flexbox</h1>
      <div class="level-indicator">
        <span id="level-title">שלב 1 מתוך 7</span>
      </div>
      <nav class="level-nav" id="level-nav">
        <!-- Level navigation buttons generated dynamically -->
      </nav>
    </header>

    <main class="game-main">
      <section class="instructions-section">
        <h2>הוראות:</h2>
        <p id="level-instruction"></p>
      </section>

      <section class="gameplay-section">
        <!-- Controls Panel -->
        <div class="controls-panel">
          <h3>מאפייני Flexbox</h3>
          <div class="control-group">
            <label for="select-flex-direction">flex-direction:</label>
            <select id="select-flex-direction">
              <option value="row">row</option>
              <option value="row-reverse">row-reverse</option>
              <option value="column">column</option>
              <option value="column-reverse">column-reverse</option>
            </select>
          </div>

          <div class="control-group">
            <label for="select-justify-content">justify-content:</label>
            <select id="select-justify-content">
              <option value="flex-start">flex-start</option>
              <option value="flex-end">flex-end</option>
              <option value="center">center</option>
              <option value="space-between">space-between</option>
              <option value="space-around">space-around</option>
              <option value="space-evenly">space-evenly</option>
            </select>
          </div>

          <div class="control-group">
            <label for="select-align-items">align-items:</label>
            <select id="select-align-items">
              <option value="flex-start">flex-start</option>
              <option value="flex-end">flex-end</option>
              <option value="center">center</option>
              <option value="baseline">baseline</option>
              <option value="stretch">stretch</option>
            </select>
          </div>

          <div class="control-group">
            <label for="select-flex-wrap">flex-wrap:</label>
            <select id="select-flex-wrap">
              <option value="nowrap">nowrap</option>
              <option value="wrap">wrap</option>
              <option value="wrap-reverse">wrap-reverse</option>
            </select>
          </div>

          <div class="button-group">
            <button id="btn-check" type="button">בדוק פתרון</button>
            <button id="btn-reset" type="button">אפס שלב</button>
            <button id="btn-prev" type="button" disabled>שלב קודם</button>
            <button id="btn-next" type="button" disabled>שלב הבא</button>
          </div>

          <div id="feedback-message" class="feedback-message" role="alert" aria-live="polite"></div>
        </div>

        <!-- Board Container (Fixed size across all screen resolutions) -->
        <div class="board-wrapper">
          <div id="game-board" class="game-board" dir="ltr">
            <!-- Target slots (where items should go) -->
            <div id="target-container" class="board-layer target-layer"></div>
            <!-- Player items (controlled by user's Flexbox properties) -->
            <div id="player-container" class="board-layer player-layer"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
